name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke test (paths, init, validate)
        shell: bash
        run: |
          node src/cli.js validate -d templates/project/flows --strict
          node src/cli.js init "$RUNNER_TEMP/proj"
          node src/cli.js validate -d "$RUNNER_TEMP/proj/flows" --strict
          test -f "$RUNNER_TEMP/proj/.gitignore" && test -f "$RUNNER_TEMP/proj/.claude/settings.json"

  # Real n8n inside the runner; the tool installed with npx from this commit,
  # exactly like a user (or the project template's GitHub Action) would.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - n8n: latest
            node: 24
          - n8n: 1.123.88
            node: 22
    name: e2e (n8n ${{ matrix.n8n }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bash .github/scripts/e2e.sh
        env:
          N8N_VERSION: ${{ matrix.n8n }}
          TOOL_SPEC: github:${{ github.repository }}#${{ github.sha }}
