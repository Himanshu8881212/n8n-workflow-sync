<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 100%);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
            gap: 0;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            padding: 32px 24px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 48px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 48px;
        }

        .stat-card {
            background: linear-gradient(135deg, #0f0f0f 0%, #050505 100%);
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: #2a2a2a;
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #999999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .actions-sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            color: #000;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 255, 255, 0.15);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            color: #fff;
            border: 1px solid #2a2a2a;
        }

        .btn-secondary:hover {
            border-color: #3a3a3a;
            transform: translateY(-2px);
        }

        /* RIGHT MAIN AREA */
        .main {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #000;
        }

        .main-header {
            padding: 32px 40px 24px 40px;
            border-bottom: 1px solid #1a1a1a;
            background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
        }

        .main-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #0f0f0f 0%, #050505 100%);
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #2a2a2a;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        .search-input::placeholder {
            color: #444;
        }

        /* WORKFLOW LIST */
        .workflow-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 40px;
        }

        .workflow-container::-webkit-scrollbar {
            width: 10px;
        }

        .workflow-container::-webkit-scrollbar-track {
            background: #000;
        }

        .workflow-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
            border-radius: 5px;
        }

        .workflow-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
        }

        .workflow-item {
            background: linear-gradient(135deg, #0f0f0f 0%, #050505 100%);
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 20px 24px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .workflow-item:hover {
            border-color: #2a2a2a;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.03);
        }

        .workflow-info {
            flex: 1;
        }

        .workflow-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }

        .workflow-meta {
            font-size: 12px;
            color: #555;
            font-family: 'Courier New', monospace;
        }

        .workflow-actions {
            display: flex;
            gap: 8px;
        }

        .workflow-actions .btn {
            padding: 8px 16px;
            font-size: 11px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 12px;
        }

        .badge.active {
            background: linear-gradient(135deg, #1a4d1a 0%, #0f3d0f 100%);
            color: #4ade80;
            box-shadow: 0 2px 8px rgba(74, 222, 128, 0.2);
        }

        .badge.inactive {
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            color: #555;
        }

        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            color: #000;
            padding: 16px 24px;
            border-radius: 8px;
            display: none;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading,
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #444;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar">
            <div class="logo">WORKFLOW SYNC</div>

            <div class="stats-sidebar">
                <div class="stat-card">
                    <div class="stat-label">Workflows</div>
                    <div class="stat-value" id="totalWorkflows">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Last Sync</div>
                    <div class="stat-value" id="lastSync" style="font-size: 14px;">Never</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" id="status" style="font-size: 18px;">Idle</div>
                </div>
            </div>

            <div class="actions-sidebar">
                <button class="btn btn-primary" onclick="triggerPull()">Pull from n8n</button>
                <button class="btn btn-secondary" onclick="triggerPush()">Push to n8n</button>
                <button class="btn btn-secondary" onclick="triggerFullSync()">Full Sync</button>
                <button class="btn btn-secondary" onclick="loadWorkflows()">Refresh</button>
            </div>
        </div>

        <!-- RIGHT MAIN AREA -->
        <div class="main">
            <div class="main-header">
                <div class="main-title">Workflows</div>
                <div class="search-container">
                    <input type="text" class="search-input" id="searchBar"
                        placeholder="Search workflows by name or ID..." oninput="filterWorkflows()">
                </div>
            </div>

            <div class="workflow-container" id="workflowList">
                <div class="loading">Loading workflows...</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>

</html>
