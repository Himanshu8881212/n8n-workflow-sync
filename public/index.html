<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
            gap: 0;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            background: linear-gradient(180deg, #0f0f0f 0%, #000000 100%);
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 40px 28px;
        }

        .logo {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 56px;
            letter-spacing: 3px;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.4;
        }

        .stats-sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 56px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .stat-card:hover {
            border-color: #3a3a3a;
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #777;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
        }

        .actions-sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            color: #000;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.25);
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            color: #fff;
            border: 1px solid #3a3a3a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary:hover {
            border-color: #4a4a4a;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.08);
        }

        /* RIGHT MAIN AREA */
        .main {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(180deg, #050505 0%, #000000 100%);
        }

        .main-header {
            padding: 40px 48px 28px 48px;
            border-bottom: 1px solid #222;
            background: linear-gradient(180deg, #0f0f0f 0%, #050505 100%);
        }

        .main-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: -1px;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .search-input:focus {
            outline: none;
            border-color: #3a3a3a;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08), inset 0 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #222 0%, #0f0f0f 100%);
        }

        .search-input::placeholder {
            color: #555;
        }

        /* WORKFLOW LIST */
        .workflow-container {
            flex: 1;
            overflow-y: auto;
            padding: 28px 48px;
        }

        .workflow-container::-webkit-scrollbar {
            width: 12px;
        }

        .workflow-container::-webkit-scrollbar-track {
            background: #000;
        }

        .workflow-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            border-radius: 6px;
            border: 2px solid #000;
        }

        .workflow-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
        }

        .workflow-item {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px 28px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .workflow-item:hover {
            border-color: #3a3a3a;
            transform: translateX(6px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.06);
        }

        .workflow-info {
            flex: 1;
        }

        .workflow-name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .workflow-meta {
            font-size: 11px;
            color: #666;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.3px;
        }

        .workflow-actions {
            display: flex;
            gap: 10px;
        }

        .workflow-actions .btn {
            padding: 10px 18px;
            font-size: 10px;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-left: 14px;
        }

        .badge.active {
            background: linear-gradient(135deg, #1a5d1a 0%, #0f4d0f 100%);
            color: #5eff5e;
            box-shadow: 0 3px 10px rgba(94, 255, 94, 0.25);
        }

        .badge.inactive {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            color: #666;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: linear-gradient(135deg, #ffffff 0%, #d0d0d0 100%);
            color: #000;
            padding: 18px 28px;
            border-radius: 12px;
            display: none;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
            letter-spacing: 0.3px;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading,
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #444;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar">
            <div class="logo">WORKFLOW SYNC</div>

            <div class="stats-sidebar">
                <div class="stat-card">
                    <div class="stat-label">Workflows</div>
                    <div class="stat-value" id="totalWorkflows">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Last Sync</div>
                    <div class="stat-value" id="lastSync" style="font-size: 14px;">Never</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" id="status" style="font-size: 18px;">Idle</div>
                </div>
            </div>

            <div class="actions-sidebar">
                <button class="btn btn-primary" onclick="triggerPull()">Pull from n8n</button>
                <button class="btn btn-secondary" onclick="triggerPush()">Push to n8n</button>
                <button class="btn btn-secondary" onclick="triggerFullSync()">Full Sync</button>
                <button class="btn btn-secondary" onclick="loadWorkflows()">Refresh</button>
            </div>
        </div>

        <!-- RIGHT MAIN AREA -->
        <div class="main">
            <div class="main-header">
                <div class="main-title">Workflows</div>
                <div class="search-container">
                    <input type="text" class="search-input" id="searchBar"
                        placeholder="Search workflows by name or ID..." oninput="filterWorkflows()">
                </div>
            </div>

            <div class="workflow-container" id="workflowList">
                <div class="loading">Loading workflows...</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>

</html>
