<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Sync</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 40px;
            color: #fff;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat {
            background: #111;
            padding: 24px;
            border-radius: 4px;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }

        .section {
            background: #111;
            padding: 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: #000;
            color: #fff;
            transition: all 0.2s;
        }

        button:hover {
            background: #222;
            border-color: #555;
        }

        .btn-primary {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-primary:hover {
            background: #e0e0e0;
        }

        .workflow-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .workflow {
            background: #0a0a0a;
            padding: 16px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .workflow-info h3 {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .workflow-info p {
            font-size: 12px;
            color: #666;
        }

        .workflow-actions {
            display: flex;
            gap: 8px;
        }

        .workflow-actions button {
            padding: 6px 14px;
            font-size: 12px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 500;
            margin-left: 8px;
            text-transform: uppercase;
        }

        .badge.active {
            background: #1a4d1a;
            color: #4ade80;
        }

        .badge.inactive {
            background: #1a1a1a;
            color: #666;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            padding: 12px 20px;
            border-radius: 4px;
            display: none;
            font-size: 13px;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loading, .empty {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Workflow Sync</h1>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Total Workflows</div>
                <div class="stat-value" id="totalWorkflows">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Last Sync</div>
                <div class="stat-value" id="lastSync" style="font-size: 14px;">Never</div>
            </div>
            <div class="stat">
                <div class="stat-label">Status</div>
                <div class="stat-value" id="status" style="font-size: 18px;">Idle</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Quick Actions</div>
            <div class="actions">
                <button class="btn-primary" onclick="triggerPull()">Pull from n8n</button>
                <button onclick="triggerPush()">Push to n8n</button>
                <button onclick="triggerFullSync()">Full Sync</button>
                <button onclick="loadWorkflows()">Refresh</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Workflows</div>
            <div id="workflowList" class="workflow-list">
                <div class="loading">Loading workflows...</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
