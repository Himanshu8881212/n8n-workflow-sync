<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            padding: 24px;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #fff;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 16px;
            border-radius: 6px;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
        }

        .section {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            border: 1px solid #222;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            background: #111;
            color: #fff;
            transition: all 0.15s;
        }

        button:hover {
            background: #1a1a1a;
            border-color: #333;
        }

        .btn-primary {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-primary:hover {
            background: #e0e0e0;
        }

        .workflows-section {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .workflows-header {
            padding: 20px 20px 16px 20px;
            border-bottom: 1px solid #1a1a1a;
        }

        .search-bar {
            width: 100%;
            padding: 10px 14px;
            background: #000;
            border: 1px solid #222;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            margin-top: 12px;
        }

        .search-bar:focus {
            outline: none;
            border-color: #333;
        }

        .search-bar::placeholder {
            color: #555;
        }

        .workflow-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .workflow-list::-webkit-scrollbar {
            width: 8px;
        }

        .workflow-list::-webkit-scrollbar-track {
            background: #000;
        }

        .workflow-list::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 4px;
        }

        .workflow-list::-webkit-scrollbar-thumb:hover {
            background: #333;
        }

        .workflow {
            background: #000;
            border: 1px solid #1a1a1a;
            padding: 14px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            transition: border-color 0.15s;
        }

        .workflow:hover {
            border-color: #2a2a2a;
        }

        .workflow-info h3 {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #fff;
        }

        .workflow-info p {
            font-size: 11px;
            color: #555;
        }

        .workflow-actions {
            display: flex;
            gap: 6px;
        }

        .workflow-actions button {
            padding: 5px 12px;
            font-size: 11px;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 9px;
            font-weight: 600;
            margin-left: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge.active {
            background: #0f3d0f;
            color: #4ade80;
        }

        .badge.inactive {
            background: #1a1a1a;
            color: #555;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            padding: 10px 16px;
            border-radius: 4px;
            display: none;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .toast.show {
            display: block;
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading,
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Workflow Sync</h1>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Total Workflows</div>
                <div class="stat-value" id="totalWorkflows">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Last Sync</div>
                <div class="stat-value" id="lastSync" style="font-size: 13px;">Never</div>
            </div>
            <div class="stat">
                <div class="stat-label">Status</div>
                <div class="stat-value" id="status" style="font-size: 16px;">Idle</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Quick Actions</div>
            <div class="actions">
                <button class="btn-primary" onclick="triggerPull()">Pull from n8n</button>
                <button onclick="triggerPush()">Push to n8n</button>
                <button onclick="triggerFullSync()">Full Sync</button>
                <button onclick="loadWorkflows()">Refresh</button>
            </div>
        </div>

        <div class="workflows-section">
            <div class="workflows-header">
                <div class="section-title">Workflows</div>
                <input type="text" class="search-bar" id="searchBar" placeholder="Search workflows..."
                    oninput="filterWorkflows()">
            </div>
            <div id="workflowList" class="workflow-list">
                <div class="loading">Loading workflows...</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>

</html>
